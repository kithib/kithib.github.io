name: Update Google Scholar Citations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2,14 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        working-directory: google_scholar_crawler
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Fetch Google Scholar citation data
        working-directory: google_scholar_crawler
        run: |
          for attempt in 1 2 3; do
            if timeout 180s python main.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done
        env:
          GOOGLE_SCHOLAR_ID: Dv8hrakAAAAJ

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -m "Update Google Scholar citation data"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats
