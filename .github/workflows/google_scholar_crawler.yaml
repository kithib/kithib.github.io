name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar citation data
        working-directory: google_scholar_crawler
        run: |
          python -m pip install --requirement requirements.txt
          python main.py
        env:
          GOOGLE_SCHOLAR_ID: Dv8hrakAAAAJ

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -m "Update Google Scholar citation data"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats
